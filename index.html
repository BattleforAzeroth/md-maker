<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="轻量 Markdown 文档编辑器" />
    <title>MD Maker</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" class="app-shell">
      <section id="login-view" class="login-card">
        <div class="brand-mark">MD</div>
        <p class="eyebrow">PRIVATE WORKSPACE</p>
        <h1>MD Maker</h1>
        <p class="muted">输入分配给你的密码，进入个人 Markdown 工作区。</p>
        <form id="login-form" class="login-form">
          <label for="password">访问密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
          <p id="login-error" class="form-error" role="alert"></p>
          <button type="submit" class="primary-button">进入工作区</button>
        </form>
        <p class="security-note">当前为轻量前端版本：文档保存在本机浏览器中。</p>
      </section>

      <section id="workspace-view" class="workspace hidden">
        <header class="topbar">
          <div class="topbar-brand">
            <div class="brand-mark small">MD</div>
            <div>
              <strong>MD Maker</strong>
              <span id="current-user" class="user-badge"></span>
            </div>
          </div>
          <div class="topbar-actions">
            <span id="save-status" class="save-status">尚未保存</span>
            <button id="save-button" class="secondary-button" type="button">手动保存</button>
            <button id="logout-button" class="ghost-button" type="button">退出</button>
          </div>
        </header>

        <div class="workspace-body">
          <aside class="sidebar">
            <div class="sidebar-heading">
              <div>
                <p class="eyebrow">DOCUMENTS</p>
                <h2>我的文件</h2>
              </div>
              <button id="new-file-button" class="icon-button" type="button" aria-label="新建文件" title="新建文件">＋</button>
            </div>
            <div id="file-list" class="file-list"></div>
            <div class="sidebar-footer">
              <p>自动保存：每 10 秒</p>
              <p>文件只保存在当前浏览器</p>
            </div>
          </aside>

          <section class="editor-panel">
            <div class="editor-toolbar">
              <input id="file-name" class="file-name-input" type="text" aria-label="文件名" />
              <div class="editor-actions">
                <button id="download-button" class="secondary-button" type="button">下载 .md</button>
                <button id="delete-button" class="danger-button" type="button">删除文件</button>
              </div>
            </div>
            <textarea id="editor" spellcheck="false" aria-label="Markdown 编辑器" placeholder="从这里开始写 Markdown..."></textarea>
            <div class="editor-footer">
              <span id="word-count">0 字符</span>
              <span>支持 Markdown 语法 · 暂不提供实时预览</span>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
